<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXTECO — Visuels Publicitaires</title>
    <link rel="icon" href="https://www.exteco.fr/wp-content/uploads/2024/06/LOGO-ROND.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f0e8;
            color: #3d4255;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3, h4, h5 { font-family: 'Plus Jakarta Sans', sans-serif; }

        :root {
            --navy: #1B3A5C;
            --navy-light: #2a5280;
            --navy-dark: #122840;
            --navy-soft: rgba(27,58,92,.06);
            --leaf: #5B8C3E;
            --leaf-light: #72a84e;
            --leaf-dark: #4a7332;
            --leaf-soft: rgba(91,140,62,.08);
            --cream: #f5f0e8;
            --cream-light: #faf7f2;
            --cream-warm: #ebe4d8;
            --white: #ffffff;
            --text-900: #1a1e2c;
            --text-700: #3d4255;
            --text-500: #6b7085;
            --text-400: #8a8fa5;
            --border: #ddd8ce;
            --border-light: #eae6dc;
            --meta-blue: #1877f2;
            --radius: 14px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --shadow: 0 2px 12px rgba(27,58,92,0.06);
            --shadow-hover: 0 8px 30px rgba(27,58,92,0.10);
            --ease: cubic-bezier(.16,1,.3,1);
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--white);
            border-bottom: 1px solid var(--border-light);
        }
        .header-top {
            background: var(--navy-dark);
            padding: 8px 24px;
        }
        .header-top-inner {
            max-width: 1440px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
        }
        .header-top-link {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            letter-spacing: 0.02em;
        }
        .header-top-link:hover { color: #fff; }
        .header-main { padding: 14px 24px; }
        .header-inner {
            max-width: 1440px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header-logo { height: 44px; width: auto; }
        .header-title-group {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .header-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--navy);
            letter-spacing: -0.02em;
        }
        .header-subtitle {
            font-size: 12px;
            color: var(--text-400);
            font-weight: 500;
        }
        .back-link {
            font-size: 13px;
            font-weight: 600;
            color: var(--navy);
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .back-link:hover { background: var(--navy-soft); }
        .live-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--leaf-soft);
            border: 1px solid rgba(91,140,62,0.25);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--leaf);
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--leaf-light);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        .controls-wrap {
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px 24px 0;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .control-group {
            background: var(--white);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .control-group.grow { flex: 1; min-width: 280px; }
        .control-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-400);
            text-transform: uppercase;
            letter-spacing: .8px;
            margin-right: 4px;
            white-space: nowrap;
        }
        .filter-chip {
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--white);
            color: var(--text-500);
            font-family: 'Inter', sans-serif;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .filter-chip:hover {
            border-color: var(--navy);
            color: var(--navy);
        }
        .filter-chip.active {
            background: var(--navy);
            border-color: var(--navy);
            color: #fff;
        }
        .date-inputs {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 4px;
        }
        .date-inputs input[type="date"] {
            font-family: inherit;
            font-size: 12px;
            padding: 5px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--white);
            color: var(--text-900);
            outline: none;
            transition: border-color .2s;
        }
        .date-inputs input[type="date"]:focus { border-color: var(--leaf); }
        .date-inputs .date-apply {
            padding: 5px 12px;
            border-radius: 8px;
            border: none;
            background: var(--navy);
            color: #fff;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s;
        }
        .date-inputs .date-apply:hover { background: var(--navy-light); }

        .summary-bar {
            max-width: 1440px;
            margin: 20px auto 0;
            padding: 0 24px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }
        .stat-card {
            background: var(--white);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: var(--transition);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
        }
        .stat-card:nth-child(odd)::before { background: var(--navy); }
        .stat-card:nth-child(even)::before { background: var(--leaf); }
        .stat-card:hover { box-shadow: var(--shadow-hover); }
        .stat-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-400);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .stat-value {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: var(--navy);
        }

        .grid-container {
            max-width: 1440px;
            margin: 24px auto 40px;
            padding: 0 24px;
        }
        .crea-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .crea-card {
            background: var(--white);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            overflow: hidden;
            transition: all .4s var(--ease);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
        }
        .crea-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
        }
        .card-image-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: var(--cream-warm);
            overflow: hidden;
        }
        .card-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .crea-card:hover .card-image-wrap img { transform: scale(1.04); }
        .card-image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-400);
            font-size: 14px;
            flex-direction: column;
            gap: 8px;
        }
        .card-image-placeholder svg { width: 48px; height: 48px; opacity: 0.3; }

        .badge-city {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--navy);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 6px;
            letter-spacing: 0.02em;
        }
        .badge-status {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 6px;
        }
        .badge-status.active { background: var(--leaf-soft); color: var(--leaf-dark); }
        .badge-status.paused { background: rgba(239,108,0,.08); color: #ef6c00; }
        .badge-status.other { background: #eee; color: #888; }

        .card-body {
            padding: 16px 18px 14px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .card-ad-name {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-900);
            line-height: 1.35;
        }
        .card-body-text {
            font-size: 13px;
            color: var(--text-500);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }
        .card-cta-badge {
            align-self: flex-start;
            background: var(--navy-soft);
            border: 1px solid rgba(27,58,92,0.15);
            color: var(--navy);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .card-kpis {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-top: 1px solid var(--border-light);
            background: var(--cream-light);
        }
        .kpi-item {
            padding: 12px 10px;
            text-align: center;
            border-right: 1px solid var(--border-light);
        }
        .kpi-item:last-child { border-right: none; }
        .kpi-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-400);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 3px;
        }
        .kpi-value {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-900);
        }
        .kpi-value.highlight { color: var(--leaf); }

        .adset-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 14px;
            cursor: pointer;
            border-top: 1px solid var(--border-light);
            font-size: 12px;
            font-weight: 600;
            color: var(--text-400);
            transition: var(--transition);
            user-select: none;
        }
        .adset-toggle:hover { color: var(--leaf); background: var(--leaf-soft); }
        .adset-toggle svg { transition: transform 0.25s ease; }
        .adset-detail { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
        .adset-detail.open { max-height: 400px; }
        .adset-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .adset-table thead th {
            padding: 8px 10px;
            text-align: left;
            font-weight: 600;
            color: var(--text-400);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-size: 10px;
            border-bottom: 1px solid var(--border-light);
            background: var(--cream-light);
        }
        .adset-table tbody td {
            padding: 8px 10px;
            color: var(--text-500);
            border-bottom: 1px solid var(--border-light);
            white-space: nowrap;
        }
        .adset-table tbody tr:last-child td { border-bottom: none; }
        .adset-table .adset-name {
            color: var(--text-900);
            font-weight: 500;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .loading-overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 120px 20px;
            gap: 20px;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid var(--border);
            border-top-color: var(--leaf);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 14px; color: var(--text-400); }

        .error-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 120px 20px;
            gap: 16px;
            text-align: center;
        }
        .error-state svg { width: 48px; height: 48px; color: #d9534f; }
        .error-state h3 { font-size: 18px; color: var(--text-900); }
        .error-state p { font-size: 14px; color: var(--text-500); max-width: 400px; }
        .error-state button {
            margin-top: 8px;
            padding: 10px 24px;
            background: var(--leaf);
            color: #fff;
            border: none;
            border-radius: var(--radius-xs);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .error-state button:hover { background: var(--leaf-dark); }
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-400);
            font-size: 15px;
        }

        @media (max-width: 1100px) {
            .crea-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .header-inner { flex-wrap: wrap; }
            .header-title { font-size: 17px; }
            .controls-wrap { flex-direction: column; gap: 10px; }
            .summary-bar { grid-template-columns: repeat(2, 1fr); }
            .crea-grid { grid-template-columns: 1fr; }
            .stat-value { font-size: 22px; }
        }
        @media (max-width: 480px) {
            .header-main { padding: 12px 16px; }
            .header-title { font-size: 15px; }
            .header-subtitle { font-size: 10px; }
            .header-logo { height: 32px; }
            .controls-wrap { padding: 0 16px; }
            .summary-bar, .grid-container { padding: 0 16px; }
            .control-group { padding: 10px 14px; gap: 8px; }
            .summary-bar { grid-template-columns: 1fr 1fr; gap: 10px; }
            .stat-card { padding: 14px 16px; }
            .card-kpis { grid-template-columns: repeat(2, 1fr); }
            .kpi-item:nth-child(2) { border-right: none; }
            .kpi-item:nth-child(3) { border-top: 1px solid var(--border-light); }
            .kpi-item:nth-child(4) { border-top: 1px solid var(--border-light); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .crea-card { animation: fadeInUp 0.4s var(--ease) both; }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-top">
            <div class="header-top-inner">
                <a href="https://www.exteco.fr" target="_blank" class="header-top-link">exteco.fr</a>
            </div>
        </div>
        <div class="header-main">
            <div class="header-inner">
                <div class="header-left">
                    <img src="https://www.exteco.fr/wp-content/uploads/2024/04/logo.png"
                         alt="EXTECO" class="header-logo"
                         onerror="this.style.display='none'">
                    <div class="header-title-group">
                        <h1 class="header-title">Visuels Publicitaires</h1>
                        <span class="header-subtitle">Performances Meta Ads — Toutes agences</span>
                    </div>
                </div>
                <a href="../portail-exteco.html" class="back-link">&larr; Retour au portail</a>
                <div class="live-badge">
                    <span class="live-dot"></span>
                    Données en direct
                </div>
            </div>
        </div>
    </header>

    <div class="controls-wrap">
        <div class="control-group grow" id="filtersBar">
            <span class="control-label">Agence</span>
            <button class="filter-chip active" data-city="all">Toutes</button>
        </div>
        <div class="control-group">
            <span class="control-label">Période</span>
            <button class="filter-chip active" data-period="all">Tout</button>
            <button class="filter-chip" data-period="7d">7j</button>
            <button class="filter-chip" data-period="30d">30j</button>
            <button class="filter-chip" data-period="90d">3 mois</button>
            <button class="filter-chip" data-period="custom">Personnalisé</button>
            <div class="date-inputs" id="dateInputs" style="display:none">
                <input type="date" id="dateStart">
                <span style="color:var(--text-400);font-size:12px">→</span>
                <input type="date" id="dateEnd">
                <button class="date-apply" id="dateApply">Appliquer</button>
            </div>
        </div>
    </div>

    <div class="summary-bar" id="summaryBar">
        <div class="stat-card">
            <span class="stat-label">Visuels actifs</span>
            <span class="stat-value" id="statCount">—</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Dépenses totales</span>
            <span class="stat-value" id="statSpend">—</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Conversions</span>
            <span class="stat-value" id="statLeads">—</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Coût / conv.</span>
            <span class="stat-value" id="statCPL">—</span>
        </div>
    </div>

    <div class="grid-container" id="gridContainer">
        <div class="loading-overlay" id="loadingState">
            <div class="spinner"></div>
            <span class="loading-text">Chargement des visuels...</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script>
    (function() {
        'use strict';

        const SHEET_ID = '1mSOSiNi_gU-TX560saphbV_eKWh08I5h78m1gwx1JGg';

        const AGENCY_TABS = [
            { city: 'Épinal', tab: 'Database_Exteco Epinal_Meta ads' },
            { city: 'Nancy', tab: 'Database_Exteco Nancy_Meta ads' },
            { city: 'Metz', tab: 'Database_Exteco Metz_Meta ads' },
            { city: 'Les Sables d\'Olonne', tab: 'Database_Exteco Les Sables D\'olonnes_Meta ads' },
            { city: 'Cannes-Fréjus', tab: 'Database_Exteco Cannes-Fréjus_Meta ads' },
            { city: 'Montbéliard-Belfort', tab: 'Database_Exteco Montbéliard-Belfort_Meta ads' },
            { city: 'Montélimar', tab: 'Database_Exteco Montélimar_Meta ads' },
            { city: 'Chalon — Le Creusot', tab: 'Database_Exteco Chalon Le Creuzot_Meta ads' },
            { city: 'Montauban', tab: 'Database_Exteco Montauban_Meta ads' },
            { city: 'Toulouse Nord', tab: 'Database_Exteco Toulouse Nord_Meta ads' },
            { city: 'Vesoul — Besançon', tab: 'Database_Exteco Vesoul Besançon_Meta ads' },
        ];

        const CITY_ALIASES = {
            'epinal': 'Épinal', 'nancy': 'Nancy', 'metz': 'Metz',
            'les sables d\'olonnes': 'Les Sables d\'Olonne', 'les sables dolonnes': 'Les Sables d\'Olonne',
            'cannes-fréjus': 'Cannes-Fréjus', 'cannes-frejus': 'Cannes-Fréjus',
            'montbéliard-belfort': 'Montbéliard-Belfort', 'montbeliard-belfort': 'Montbéliard-Belfort',
            'montélimar': 'Montélimar', 'montelimar': 'Montélimar',
            'châlon & le creusot': 'Chalon — Le Creusot', 'chalon & le creusot': 'Chalon — Le Creusot',
            'montauban': 'Montauban', 'toulouse nord': 'Toulouse Nord',
            'vesoul-besançon': 'Vesoul — Besançon', 'vesoul-besancon': 'Vesoul — Besançon',
        };

        function extractCity(campaignName) {
            if (!campaignName) return 'Autre';
            const parts = campaignName.replace(/^\[.*?\]/, '').split('_');
            const last = parts[parts.length - 1].trim();
            const secondLast = parts.length > 1 ? parts[parts.length - 2].trim() : '';
            const candidate = (secondLast + ' ' + last).toLowerCase();
            for (const [key, val] of Object.entries(CITY_ALIASES)) {
                if (candidate.indexOf(key) >= 0 || last.toLowerCase().indexOf(key) >= 0) return val;
            }
            const lastLower = last.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
            for (const [key, val] of Object.entries(CITY_ALIASES)) {
                const keyNorm = key.normalize('NFD').replace(/[̀-ͯ]/g, '');
                if (lastLower.indexOf(keyNorm) >= 0) return val;
            }
            return last || 'Autre';
        }

        let allCreas = [];
        let allRawRows = [];
        let activeCity = 'all';
        let activePeriod = 'all';
        let customStart = null;
        let customEnd = null;

        const gridContainer  = document.getElementById('gridContainer');
        const filtersBar     = document.getElementById('filtersBar');
        const statCount      = document.getElementById('statCount');
        const statSpend      = document.getElementById('statSpend');
        const statLeads      = document.getElementById('statLeads');
        const statCPL        = document.getElementById('statCPL');

        function pNum(v) {
            if (v == null) return 0;
            const s = String(v).trim();
            if (s === '' || s === '-') return 0;
            const cleaned = s.replace(/[\s ]/g, '').replace(',', '.');
            const n = parseFloat(cleaned);
            return isNaN(n) ? 0 : n;
        }

        function fmtEur(n) {
            return n.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
        }
        function fmtInt(n) { return Math.round(n).toLocaleString('fr-FR'); }
        function fmtPct(n) { return n.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' %'; }

        const CTA_MAP = {
            'LEARN_MORE': 'En savoir plus', 'SIGN_UP': "S'inscrire", 'CONTACT_US': 'Nous contacter',
            'GET_QUOTE': 'Obtenir un devis', 'APPLY_NOW': 'Postuler', 'BOOK_NOW': 'Réserver',
            'DOWNLOAD': 'Télécharger', 'SHOP_NOW': 'Acheter', 'SUBSCRIBE': "S'abonner",
            'SEND_MESSAGE': 'Envoyer un message', 'CALL_NOW': 'Appeler', 'GET_OFFER': "Obtenir l'offre",
            'REQUEST_TIME': 'Prendre rendez-vous', 'SEE_MORE': 'Voir plus', 'WATCH_MORE': 'Voir la vidéo',
            'NO_BUTTON': 'Aucun', 'MESSAGE_PAGE': 'Envoyer un message', 'WHATSAPP_MESSAGE': 'WhatsApp',
        };
        function translateCTA(raw) {
            if (!raw) return '';
            const key = raw.trim().toUpperCase();
            return CTA_MAP[key] || raw.replace(/_/g, ' ').toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
        }

        function translateStatus(raw) {
            if (!raw) return { label: 'Inconnu', cls: 'other' };
            const s = raw.trim().toUpperCase();
            if (s === 'ACTIVE') return { label: 'Actif', cls: 'active' };
            if (s === 'PAUSED') return { label: 'En pause', cls: 'paused' };
            if (s === 'DELETED') return { label: 'Supprimé', cls: 'other' };
            if (s === 'ARCHIVED') return { label: 'Archivé', cls: 'other' };
            return { label: raw, cls: 'other' };
        }

        function getBaseName(adName) {
            if (!adName) return '';
            return adName
                .replace(/^EXTECO[_\-\s]*/i, '')
                .replace(/^[A-Za-zÀ-ÿ]+[_\-\s]*\d{4,}[_\-\s]*/i, '')
                .replace(/\s*-\s*Copie\s*$/i, '')
                .replace(/_/g, ' ')
                .trim();
        }

        function prettifyName(baseName) {
            if (!baseName) return 'Sans nom';
            return baseName.charAt(0).toUpperCase() + baseName.slice(1);
        }

        function simplifyAdSet(adSetName) {
            if (!adSetName) return '';
            return adSetName
                .replace(/^EXTECO[_\-\s]*/i, '')
                .replace(/^[A-Za-zÀ-ÿ]+[_\-\s]*\d{4,}[_\-\s]*/i, '')
                .replace(/_/g, ' ')
                .trim() || adSetName;
        }

        async function fetchTab(tabName) {
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tabName)}`;
            const resp = await fetch(url);
            if (!resp.ok) throw new Error(`HTTP ${resp.status} pour ${tabName}`);
            const text = await resp.text();
            const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
            return (parsed.data || []).filter(r => {
                const camp = (r["Nom de la campagne"] || '').trim();
                return camp.toUpperCase().startsWith('EXTECO');
            });
        }

        async function fetchRawData() {
            const fetches = AGENCY_TABS.map(a =>
                fetchTab(a.tab).then(rows => {
                    rows.forEach(r => { r._city = a.city; });
                    return rows;
                }).catch(() => [])
            );
            const all = (await Promise.all(fetches)).flat();
            if (all.length === 0) throw new Error('Aucune donnée chargée');
            return all;
        }

        function getDateRange() {
            const now = new Date();
            if (activePeriod === 'custom' && customStart && customEnd) return { start: customStart, end: customEnd };
            if (activePeriod === '7d') { const s = new Date(now); s.setDate(s.getDate() - 7); return { start: s.toISOString().slice(0,10), end: now.toISOString().slice(0,10) }; }
            if (activePeriod === '30d') { const s = new Date(now); s.setDate(s.getDate() - 30); return { start: s.toISOString().slice(0,10), end: now.toISOString().slice(0,10) }; }
            if (activePeriod === '90d') { const s = new Date(now); s.setDate(s.getDate() - 90); return { start: s.toISOString().slice(0,10), end: now.toISOString().slice(0,10) }; }
            return null;
        }

        function aggregateRows(rows) {
            const range = getDateRange();
            const filtered = range
                ? rows.filter(r => { const d = (r["Date"] || '').trim(); return d >= range.start && d <= range.end; })
                : rows;

            const map = {};
            for (const row of filtered) {
                const adName = row["Nom de la publicité"] || '';
                if (!adName) continue;

                const base = getBaseName(adName);
                const key = base.toLowerCase() + '||' + row._city;
                const adSet = row["Nom de l'ensemble de publicités"] || '';

                const imp = pNum(row["Impressions"]);
                const clicks = pNum(row["Clics (tous)"]);
                const cost = pNum(row["Coût (EUR)"]);
                const linkClicks = pNum(row["Clics sur les liens"]);
                const leads = pNum(row["Conversions de site web"] || row["Leads du site web"]);
                const ctr = pNum(row["CTR (tous)"]);

                if (!map[key]) {
                    map[key] = {
                        baseName: base,
                        imageURL: row["URL de l'image de la création de l'annonce"] || '',
                        bodyText: row["Texte de l'actif du corps"] || '',
                        headline: row["Titre de la création"] || '',
                        cta: row["Type d'appel à l'action de l'annonce"] || '',
                        status: row["Statut de l'annonce"] || '',
                        city: row._city,
                        impressions: 0, clicks: 0, cost: 0, linkClicks: 0, leads: 0,
                        _ctrSum: 0, _ctrW: 0,
                        adSets: {}
                    };
                }
                const agg = map[key];
                agg.impressions += imp;
                agg.clicks += clicks;
                agg.cost += cost;
                agg.linkClicks += linkClicks;
                agg.leads += leads;
                agg._ctrSum += ctr * imp;
                agg._ctrW += imp;

                if (!agg.imageURL && row["URL de l'image de la création de l'annonce"])
                    agg.imageURL = row["URL de l'image de la création de l'annonce"];
                const bt = row["Texte de l'actif du corps"] || '';
                if (bt.length > agg.bodyText.length) agg.bodyText = bt;
                if (row["Statut de l'annonce"] === 'ACTIVE') agg.status = 'ACTIVE';

                const setKey = simplifyAdSet(adSet);
                if (!agg.adSets[setKey]) {
                    agg.adSets[setKey] = { impressions: 0, clicks: 0, cost: 0, leads: 0 };
                }
                agg.adSets[setKey].impressions += imp;
                agg.adSets[setKey].clicks += clicks;
                agg.adSets[setKey].cost += cost;
                agg.adSets[setKey].leads += leads;
            }

            return Object.values(map).map(c => {
                c.ctr = c._ctrW > 0 ? (c._ctrSum / c._ctrW) : 0;
                c.cpl = c.leads > 0 ? (c.cost / c.leads) : 0;
                c.simpleName = prettifyName(c.baseName);
                c.adSetList = Object.entries(c.adSets)
                    .map(([name, d]) => ({ name, ...d, cpl: d.leads > 0 ? d.cost / d.leads : 0 }))
                    .sort((a, b) => b.cost - a.cost);
                delete c._ctrSum; delete c._ctrW; delete c.adSets;
                return c;
            });
        }

        function buildFilters(creas) {
            const cities = [...new Set(creas.map(c => c.city))].sort();
            filtersBar.querySelectorAll('.filter-chip[data-city]:not([data-city="all"])').forEach(el => el.remove());
            cities.forEach(city => {
                const btn = document.createElement('button');
                btn.className = 'filter-chip';
                btn.dataset.city = city;
                btn.textContent = city;
                btn.addEventListener('click', () => setActiveCity(city));
                filtersBar.appendChild(btn);
            });
        }

        function setActiveCity(city) {
            activeCity = city;
            filtersBar.querySelectorAll('.filter-chip').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.city === city);
            });
            render();
        }

        document.querySelector('.filter-chip[data-city="all"]').addEventListener('click', () => setActiveCity('all'));

        function updateSummary(filtered) {
            const count = filtered.length;
            const totalSpend = filtered.reduce((s, c) => s + c.cost, 0);
            const totalLeads = filtered.reduce((s, c) => s + c.leads, 0);
            const avgCPL = totalLeads > 0 ? totalSpend / totalLeads : 0;
            statCount.textContent = fmtInt(count);
            statSpend.innerHTML = fmtEur(totalSpend);
            statLeads.textContent = fmtInt(totalLeads);
            statCPL.innerHTML = totalLeads > 0 ? fmtEur(avgCPL) : '—';
        }

        function render() {
            let filtered = activeCity === 'all' ? [...allCreas] : allCreas.filter(c => c.city === activeCity);
            filtered.sort((a, b) => b.cost - a.cost);
            updateSummary(filtered);

            let html = '<div class="crea-grid">';
            if (filtered.length === 0) {
                html += '<div class="empty-state">Aucun visuel trouvé pour ce filtre.</div>';
            } else {
                filtered.forEach((c, idx) => {
                    const st = translateStatus(c.status);
                    const ctaLabel = translateCTA(c.cta);
                    const delay = Math.min(idx * 0.06, 0.8);
                    const cardId = 'detail-' + idx;
                    const hasMultipleSets = c.adSetList.length > 1;

                    let detailHTML = '';
                    if (hasMultipleSets) {
                        detailHTML = `
                        <div class="adset-toggle" onclick="document.getElementById('${cardId}').classList.toggle('open')">
                            <span>${c.adSetList.length} ensembles de pubs</span>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                        </div>
                        <div class="adset-detail" id="${cardId}">
                            <table class="adset-table">
                                <thead><tr><th>Ensemble</th><th>Dép.</th><th>Conv.</th><th>CPA</th></tr></thead>
                                <tbody>
                                ${c.adSetList.map(s => `
                                    <tr>
                                        <td class="adset-name">${escHTML(s.name)}</td>
                                        <td>${fmtEur(s.cost)}</td>
                                        <td>${fmtInt(s.leads)}</td>
                                        <td>${s.leads > 0 ? fmtEur(s.cpl) : '—'}</td>
                                    </tr>`).join('')}
                                </tbody>
                            </table>
                        </div>`;
                    }

                    html += `
                    <div class="crea-card" style="animation-delay: ${delay}s">
                        <div class="card-image-wrap">
                            ${c.imageURL
                                ? `<img src="${escHTML(c.imageURL)}" alt="${escHTML(c.simpleName)}" loading="lazy" decoding="async" onerror="this.parentNode.innerHTML='<div class=\\'card-image-placeholder\\'><svg viewBox=\\'0 0 24 24\\' fill=\\'none\\' stroke=\\'currentColor\\' stroke-width=\\'1.5\\'><rect x=\\'3\\' y=\\'3\\' width=\\'18\\' height=\\'18\\' rx=\\'2\\'/><circle cx=\\'8.5\\' cy=\\'8.5\\' r=\\'1.5\\'/><path d=\\'M21 15l-5-5L5 21\\'/></svg><span>Image indisponible</span></div>'">`
                                : `<div class="card-image-placeholder">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                                    <span>Pas de visuel</span>
                                  </div>`
                            }
                            <span class="badge-city">${escHTML(c.city)}</span>
                            <span class="badge-status ${st.cls}">${st.label}</span>
                        </div>
                        <div class="card-body">
                            <div class="card-ad-name">${escHTML(c.simpleName)}</div>
                            ${c.bodyText ? `<div class="card-body-text">${escHTML(c.bodyText)}</div>` : ''}
                            ${ctaLabel ? `<span class="card-cta-badge">${escHTML(ctaLabel)}</span>` : ''}
                        </div>
                        <div class="card-kpis">
                            <div class="kpi-item"><div class="kpi-label">Dépenses</div><div class="kpi-value">${fmtEur(c.cost)}</div></div>
                            <div class="kpi-item"><div class="kpi-label">Conv.</div><div class="kpi-value highlight">${fmtInt(c.leads)}</div></div>
                            <div class="kpi-item"><div class="kpi-label">CPA</div><div class="kpi-value">${c.leads > 0 ? fmtEur(c.cpl) : '—'}</div></div>
                            <div class="kpi-item"><div class="kpi-label">CTR</div><div class="kpi-value">${c.impressions > 0 ? fmtPct(c.ctr) : '—'}</div></div>
                        </div>
                        ${detailHTML}
                    </div>`;
                });
            }
            html += '</div>';
            gridContainer.innerHTML = html;
        }

        function escHTML(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function showError(msg) {
            gridContainer.innerHTML = `
                <div class="error-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    <h3>Erreur de chargement</h3>
                    <p>${escHTML(msg)}</p>
                    <button onclick="location.reload()">Réessayer</button>
                </div>`;
        }

        function showConfigNeeded() {
            gridContainer.innerHTML = `
                <div class="error-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="color:var(--navy)">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <path d="M3 9h18M9 21V9"/>
                    </svg>
                    <h3>Configuration requise</h3>
                    <p>Les requêtes Supermetrics pour les visuels créatifs ne sont pas encore configurées dans le Google Sheet.<br><br>
                    <strong>Colonnes nécessaires par onglet :</strong><br>
                    Nom de la publicité, URL de l'image, Texte du corps, Titre, CTA, Statut, Date, Impressions, Clics, Coût, Leads, CPL</p>
                </div>`;
        }

        function refreshFromRaw() {
            allCreas = aggregateRows(allRawRows);
            buildFilters(allCreas);
            render();
        }

        function setPeriod(period) {
            activePeriod = period;
            document.querySelectorAll('.filter-chip[data-period]').forEach(b => {
                b.classList.toggle('active', b.dataset.period === period);
            });
            const di = document.getElementById('dateInputs');
            di.style.display = period === 'custom' ? 'flex' : 'none';
            if (period !== 'custom') refreshFromRaw();
        }

        document.querySelectorAll('.filter-chip[data-period]').forEach(btn => {
            btn.addEventListener('click', () => setPeriod(btn.dataset.period));
        });

        document.getElementById('dateApply').addEventListener('click', () => {
            customStart = document.getElementById('dateStart').value;
            customEnd = document.getElementById('dateEnd').value;
            if (customStart && customEnd) refreshFromRaw();
        });

        async function init() {
            if (typeof Papa === 'undefined') {
                showError('PapaParse non chargé.');
                return;
            }
            try {
                document.getElementById('loadingState').style.display = 'flex';
                allRawRows = await fetchRawData();
                allCreas = aggregateRows(allRawRows);
                document.getElementById('loadingState').style.display = 'none';
                buildFilters(allCreas);
                render();
            } catch (err) {
                document.getElementById('loadingState').style.display = 'none';
                showError(err.message || 'Impossible de charger les données.');
            }
        }

        init();
    })();
    </script>
</body>
</html>
